<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp API Tester</title>
    <!-- Pulling in Tailwind CSS for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-100">
        <h2 class="text-2xl font-bold mb-6 text-slate-800 tracking-tight">Test WhatsApp Message</h2>

        <form id="whatsappForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700">Recipient Number</label>
                <input type="text" id="recipientNumber" value="918851253661"
                    class="mt-1 block w-full border border-slate-300 rounded-lg shadow-sm py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors"
                    required>
                <p class="text-xs text-slate-500 mt-1.5">Include country code without '+' (e.g., 91 for India)</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700">Customer Name</label>
                <input type="text" id="customerName" value="Jane Smith"
                    class="mt-1 block w-full border border-slate-300 rounded-lg shadow-sm py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors"
                    required>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700">Order Number</label>
                <input type="text" id="orderNumber" value="987654"
                    class="mt-1 block w-full border border-slate-300 rounded-lg shadow-sm py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors"
                    required>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700">Order Date</label>
                <input type="text" id="orderDate" value="Aug 5, 2026"
                    class="mt-1 block w-full border border-slate-300 rounded-lg shadow-sm py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-colors"
                    required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 border border-transparent rounded-lg shadow-sm py-2.5 px-4 inline-flex justify-center text-sm font-bold text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                Send Message
            </button>
        </form>

        <!-- Response Window -->
        <div id="responseContainer" class="mt-6 hidden">
            <h3 class="text-sm font-bold text-slate-700 mb-2">API Response:</h3>
            <pre id="responseOutput"
                class="bg-slate-800 p-4 rounded-lg text-xs font-mono text-green-400 overflow-x-auto shadow-inner"></pre>
        </div>
    </div>

    <script>
        document.getElementById('whatsappForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            // Construct payload from inputs
            const payload = {
                recipientNumber: document.getElementById('recipientNumber').value,
                customerName: document.getElementById('customerName').value,
                orderNumber: document.getElementById('orderNumber').value,
                orderDate: document.getElementById('orderDate').value
            };

            const responseContainer = document.getElementById('responseContainer');
            const responseOutput = document.getElementById('responseOutput');

            try {
                // Pointing to the Express backend we just built
                const response = await fetch('https://whatsapp-api-83et.onrender.com/api/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                // Display the response
                responseContainer.classList.remove('hidden');
                responseOutput.textContent = JSON.stringify(data, null, 2);

                // Simple color handling for success vs error
                if (response.ok) {
                    responseOutput.classList.replace('text-red-400', 'text-green-400');
                } else {
                    responseOutput.classList.replace('text-green-400', 'text-red-400');
                }

            } catch (error) {
                // Catch network or fetch errors
                responseContainer.classList.remove('hidden');
                responseOutput.textContent = JSON.stringify({ error: error.message }, null, 2);
                responseOutput.classList.replace('text-green-400', 'text-red-400');
            } finally {
                // Reset button state
                submitBtn.textContent = 'Send Message';
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        });
    </script>
</body>

</html>
